services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_USER: appuser
      DB_PASS: apppassword
      DB_HOST: db
      DB_NAME: tempconverter
      STUDENT: Default Student
      COLLEGE: Default College
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tempconverter
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-papppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
