# ── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: tempconverter

---
# ── Secret — DB credentials shared by MySQL and the app ──────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: tempconverter
type: Opaque
stringData:
  root-password: rootpassword
  username: appuser
  password: apppassword

---
# ── PersistentVolumeClaim — MySQL data volume ─────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
  namespace: tempconverter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# ── MySQL Deployment (1 replica) ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: tempconverter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: root-password
        - name: MYSQL_DATABASE
          value: tempconverter
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: db-pvc

---
# ── MySQL Service (ClusterIP — internal only) ─────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: tempconverter
spec:
  selector:
    app: db
  ports:
  - port: 3306
    targetPort: 3306

---
# ── App Deployment (2 replicas, anti-affinity enforces different nodes) ────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: tempconverter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tempconverter
  template:
    metadata:
      labels:
        app: tempconverter
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - tempconverter
            topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: pgraczi/tempconverter:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: db
        - name: DB_NAME
          value: tempconverter
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password

---
# ── App Service (ClusterIP — nginx reaches it by name) ───────────────────────
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: tempconverter
spec:
  selector:
    app: tempconverter
  ports:
  - port: 5000
    targetPort: 5000

---
# ── Nginx ConfigMap ───────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: tempconverter
data:
  default.conf: |
    upstream app {
        server app:5000;
    }
    server {
        listen 80;
        location / {
            proxy_pass          http://app;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

---
# ── Nginx Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: tempconverter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf

---
# ── Nginx Service (NodePort 30080 → port-mapped to host :80 via kind-config) ──
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: tempconverter
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
