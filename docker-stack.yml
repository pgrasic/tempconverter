version: '3.9'

services:

  # ── Reverse proxy ────────────────────────────────────────────────────────────
  # Nginx listens on port 80 and forwards to Docker's internal VIP for "app",
  # which Swarm load-balances across all healthy app replicas.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - tempconverter-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ── Application ──────────────────────────────────────────────────────────────
  # Two replicas, max one per node, so they are guaranteed to land on
  # different hosts (requires at least 2 nodes in the swarm).
  app:
    image: pgraczi/tempconverter:latest
    environment:
      DB_USER: appuser
      DB_PASS: apppassword
      DB_HOST: db
      DB_NAME: tempconverter
      STUDENT: Default Student
      COLLEGE: Default College
    networks:
      - tempconverter-net
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # ── Database ─────────────────────────────────────────────────────────────────
  # Single replica with a named volume for persistent storage.
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tempconverter
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tempconverter-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

configs:
  nginx_conf:
    file: ./nginx.conf

networks:
  tempconverter-net:
    driver: overlay

volumes:
  db_data:
